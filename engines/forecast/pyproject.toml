[project]
name = "ccam-forecast"
version = "0.1.0"
description = "CCAM forecast engine — LSTM + Prophet + ARIMA ensemble for demand forecasting"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "tensorflow>=2.18.0",
    "prophet>=1.1.6",
    "statsmodels>=0.14.0",
    "scikit-learn>=1.5.0",
    "joblib>=1.4.0",
    "tf2onnx>=1.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
