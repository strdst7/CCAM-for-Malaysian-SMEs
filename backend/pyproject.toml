[project]
name = "ccam-backend"
version = "0.1.0"
description = "CCAM tenant-isolated FastAPI backend"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "redis[hiredis]>=5.2.0",
    "arq>=0.26.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "click>=8.4.1",
    "pyyaml>=6.0.3",
    "httpx>=0.28.0",
    "bcrypt>=4.2.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "testcontainers[postgres,redis]>=4.9.0",
    "httpx>=0.28.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[project.scripts]
ccam-backend = "ccam_backend.cli:cli"
