[project]
name = "ccam-sim"
version = "0.1.0"
description = "CCAM deterministic digital twin restaurant simulator"
requires-python = ">=3.14"
dependencies = [
    "click>=8.4.1",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
ccam-sim = "ccam_sim.cli:cli"
